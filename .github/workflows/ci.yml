name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        working-directory: resale-datasg-backend
        run: mvn -B verify

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resale-datasg-frontend/package-lock.json

      # npm ci demands the lock file exactly match what npm would resolve fresh.
      # Vite ships rolldown's per-OS native bindings (plus a wasm32-wasi fallback
      # pulling in @emnapi/*) as optionalDependencies, and npm resolves that
      # subtree differently per host platform - a lock file generated on one OS
      # isn't guaranteed to satisfy npm ci on another. npm install resolves fresh
      # against package.json on the runner itself, sidestepping that drift.
      - name: Install dependencies
        working-directory: resale-datasg-frontend
        run: npm install

      - name: Lint
        working-directory: resale-datasg-frontend
        run: npm run lint

      - name: Test
        working-directory: resale-datasg-frontend
        run: npm run test -- --run

      - name: Build
        working-directory: resale-datasg-frontend
        run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no credentials needed)
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/terraform
        run: terraform validate
