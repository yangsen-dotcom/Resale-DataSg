spring:
  application:
    name: resale-datasg-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/resale_datasg}
    username: ${DB_USERNAME:resale_datasg}
    password: ${DB_PASSWORD:resale_datasg}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:9090}

resale:
  ingestion:
    dataset-id: d_8b84c4ee58e3cfc0ece0d773c8ca6abc
    api-base-url: https://data.gov.sg
    page-size: 10000
    cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    sg.datasg.resale: INFO
